<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《沧澜归屿》读者客服中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{
  min-height:100vh;
}
#maskPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  background-color:#e8edf4;
}
.mask-container{
  max-width:540px;
  width:100%;
  background:rgba(255,255,255,0.92);
  padding:36px 32px;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,0.12);
  position:relative;
}
.header{text-align:center;margin-bottom:30px}
.book-title{font-size:19px;font-weight:600;margin-bottom:8px;color:#222}
.desc{font-size:13px;color:#666}
.form-item{margin-bottom:22px}
label{display:block;font-size:14px;margin-bottom:8px;color:#444}
input{
  width:100%;
  padding:14px 15px;
  border:1px solid #bbb;
  border-radius:9px;
  font-size:15px;
  background:#fff;
}
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:9px;
  background:#1f2937;
  color:#fff;
  font-size:15px;
  cursor:pointer;
  transition:0.2s;
}
.btn:hover{background:#374151}

.audio-tip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
  font-size: 13px;
  color: #6b7280;
  animation: pulse 2s ease-in-out infinite;
}

.audio-tip img {
  width: 20px;
  height: 20px;
  object-fit: contain;
}

@keyframes pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}

.audio-control-btn{
  position:absolute;
  top:16px;
  right:16px;
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid #ddd;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.audio-control-btn img{
  width:20px;
  height:20px;
}

.tips{margin-top:16px;font-size:12px;color:#777;text-align:center}
.error-text{color:#c82423;font-size:13px;margin-top:10px;display:none}

#surprisePage{
  min-height:100vh;
  display:none;
  justify-content:center;
  align-items:center;
  padding:24px 16px;
  background-color:#f0e8ee;
}
.surprise-box{
  max-width:580px;
  width:100%;
  background:rgba(255,255,255,0.88);
  padding:40px 32px;
  border-radius:16px;
  backdrop-filter:blur(6px);
  position:relative;
}
.surprise-box h1{
  text-align:center;
  font-size:26px;
  margin-bottom:22px;
  color:#222;
}
.surprise-box p{
  line-height:2;
  font-size:16px;
  color:#333;
  margin-bottom:16px;
  text-align:center;
}
.img-show{
  width:100%;
  border-radius:12px;
  margin:20px 0;
}
</style>
</head>
<body>
<audio id="bgMusic" loop preload="auto">
  <source src="./bgm.mp3" type="audio/mpeg">



<div id="maskPage">
  <div class="mask-container">
    <div class="audio-control-btn" id="audioToggle">
      <img id="speakerIcon" src="https://cdn-icons-png.flaticon.com/512/727/727269.png" alt="音乐">
    </div>

    <div class="header">
      <div class="book-title">《沧澜归屿》读者客服中心</div>
      <div class="desc">书籍序列号核验｜读者问题反馈</div>
    </div>
    <div class="form-item">
      <label>请输入印刷在扉页的书籍序列号</label>
      <input id="passwordInput" placeholder="在此输入序列号">
      <div class="error-text" id="errMsg">序列号无效，请核对实体书扉页重新输入</div>
    </div>
    <button class="btn" id="submitBtn">提交核验</button>

    <div class="audio-tip">
      <img src="https://cdn-icons-png.flaticon.com/512/727/727269.png" alt="声音图标">
      <span>点击页面任意位置开启背景音乐</span>
    </div>

    <div class="tips">仅正版实体书籍可完成核验 · 客服工作时间 10:00‑22:00</div>
  </div>
</div>

<div id="surprisePage">
  <div class="surprise-box">
    <div class="audio-control-btn" id="audioToggle2">
      <img id="speakerIcon2" src="https://cdn-icons-png.flaticon.com/512/727/727269.png" alt="音乐">
    </div>

    <h1>致我的女孩</h1>
    <p>跨越新山与贵阳遥遥的距离<br>我把所有日思夜想，都写进这本书。</p>
    <p>莫比乌斯对戒象征没有尽头的思念<br>山海相隔，但我的心意不会被距离隔断。</p>
    <img class="img-show" src="" alt="回忆照片">
    <p>往后岁岁年年，我都想要和你一起。<br>属于我们的故事，还会继续往下写。</p>
    <p>💛</p>
  </div>
</div>

<script>
const SECRET_PASSWORD = "990702051125";
// 暂时禁用外网图片防盗链
const bgMaskUrl = "https://images.pexels.com/photos/5713818/pexels-photo-5713818.jpeg";
const bgSurpriseUrl = "https://images.pexels.com/photos/20137266/pexels-photo-20137266.jpeg";
const musicUrl = "./bgm.mp3";

const maskPage = document.querySelector("#maskPage");
const surprisePage = document.querySelector("#surprisePage");
const inputEl = document.querySelector("#passwordInput");
const submitBtn = document.querySelector("#submitBtn");
const errMsg = document.querySelector("#errMsg");
const audio = document.querySelector("#bgMusic");
const audioToggle = document.querySelector("#audioToggle");
const audioToggle2 = document.querySelector("#audioToggle2");
const speakerIcon = document.querySelector("#speakerIcon");
const speakerIcon2 = document.querySelector("#speakerIcon2");

const iconPlay = "https://cdn-icons-png.flaticon.com/512/727/727269.png";
const iconMute = "https://cdn-icons-png.flaticon.com/512/727/727271.png";

let userActivated = false;

if(bgMaskUrl) maskPage.style.backgroundImage = `url(${bgMaskUrl})`;
if(bgSurpriseUrl) surprisePage.style.backgroundImage = `url(${bgSurpriseUrl})`;
if(musicUrl) audio.src = musicUrl;

audio.addEventListener("loadedmetadata",function(){
  let savedTime = localStorage.getItem("bgmTime");
  if(savedTime) audio.currentTime = parseFloat(savedTime);
});

audio.addEventListener("timeupdate",()=>{
  localStorage.setItem("bgmTime", audio.currentTime);
});

function updateIcon(){
  if(audio.paused){
    speakerIcon.src = iconMute;
    speakerIcon2.src = iconMute;
  }else{
    speakerIcon.src = iconPlay;
    speakerIcon2.src = iconPlay;
  }
}

document.body.addEventListener("click",function(){
  if(!userActivated){
    userActivated = true;
    audio.play().catch(e=>{});
    updateIcon();
  }
},{once:true});

function toggleAudio(){
  if(!userActivated) return;
  if(audio.paused){
    audio.play().catch(e=>{});
  }else{
    audio.pause();
  }
  updateIcon();
}

audioToggle.onclick = toggleAudio;
audioToggle2.onclick = toggleAudio;

submitBtn.onclick = function(){
  errMsg.style.display = "none";
  const val = inputEl.value.trim();
  if(val === SECRET_PASSWORD){
    maskPage.style.display = "none";
    surprisePage.style.display = "flex";
    window.scrollTo(0,0);
  }else{
    errMsg.style.display = "block";
  }
}
</script>
</body>
</html>
